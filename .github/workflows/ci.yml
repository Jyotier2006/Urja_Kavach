name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Required: this project pins through .lock files, and none of them match the
          # action's default dependency globs, so caching fails to resolve a file and errors.
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      # Quoted: the `:all:` in --only-binary puts a colon-space inside the value, which YAML
      # cannot carry in a plain scalar. Unquoted, GitHub rejects the whole file as invalid.
      - run: "pip install --only-binary=:all: -r requirements.lock"
      # Test-only: supplies the in-process MQTT broker the ingestion chain test runs against.
      - run: "pip install --only-binary=:all: -r requirements-dev.lock"
      - run: python -m pytest services tests -q

  web:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # The workspace build script invokes scripts/build_offline.py, so Python must be present.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: apps/web/out
          retention-days: 7

  e2e:
    name: Browser journey
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: artifacts/qa/browser
          retention-days: 7

  images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Built but not pushed: publishing needs registry credentials this repository does not set.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: urjakavach-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          tags: urjakavach-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Actually rolls the dev overlay out to a real cluster and waits for the pods to serve traffic.
  # The manifests job below only checks the YAML; this one proves the thing runs.
  k8s-rollout:
    name: Kubernetes rollout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          load: true
          tags: urjakavach-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          load: true
          tags: urjakavach-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create a Kubernetes cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: urjakavach

      # kind runs its own containerd, so images built on the host are not visible until loaded.
      - name: Load the images into the cluster
        run: |
          kind load docker-image urjakavach-api:latest --name urjakavach
          kind load docker-image urjakavach-web:latest --name urjakavach

      - name: Apply the dev overlay
        run: kubectl apply -k k8s/overlays/dev

      - name: Wait for every deployment to become available
        run: |
          for d in urjakavach-db urjakavach-api urjakavach-web; do
            kubectl rollout status "deployment/$d" -n urjakavach-dev --timeout=300s
          done

      - name: Show what is running
        run: |
          kubectl get pods,svc,ingress -n urjakavach-dev -o wide
          kubectl get deployments -n urjakavach-dev

      # The proof that matters: the pods answer over the network, not merely that they started.
      - name: Call the API and the web app through the cluster
        run: |
          kubectl port-forward -n urjakavach-dev svc/urjakavach-api 8000:8000 &
          kubectl port-forward -n urjakavach-dev svc/urjakavach-web 8080:80 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && break || sleep 2
          done
          echo "--- API /health ---"
          curl -fsS http://127.0.0.1:8000/health
          echo ""
          echo "--- API reports its database ---"
          kubectl exec -n urjakavach-dev deploy/urjakavach-api -- \
            python -c "import os;print('DATABASE_URL scheme:', os.environ.get('DATABASE_URL','sqlite').split('://')[0])"
          echo "--- web app title ---"
          curl -fsS http://127.0.0.1:8080/ | grep -o '<title>[^<]*</title>' | head -1

      - name: Diagnose on failure
        if: failure()
        run: |
          kubectl get pods -n urjakavach-dev -o wide || true
          kubectl describe pods -n urjakavach-dev || true
          kubectl logs -n urjakavach-dev -l app.kubernetes.io/name=urjakavach --all-containers --tail=80 || true

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0
      # `kubectl apply --dry-run=client` still downloads the OpenAPI schema from a live cluster,
      # so it cannot validate anything on a runner - it fails on the connection, not the manifests.
      # kubeconform checks the rendered output against the Kubernetes JSON schemas offline.
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
      - name: Render and validate both overlays
        run: |
          for overlay in dev prod; do
            echo "::group::$overlay"
            kubectl kustomize "k8s/overlays/$overlay" \
              | kubeconform -strict -summary -kubernetes-version 1.30.0
            echo "::endgroup::"
          done
