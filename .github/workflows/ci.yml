name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Quoted: the `:all:` in --only-binary puts a colon-space inside the value, which YAML
      # cannot carry in a plain scalar. Unquoted, GitHub rejects the whole file as invalid.
      - run: "pip install --only-binary=:all: -r requirements.lock"
      # Test-only: supplies the in-process MQTT broker the ingestion chain test runs against.
      - run: "pip install --only-binary=:all: -r requirements-dev.lock"
      - run: python -m pytest services tests -q

  web:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # The workspace build script invokes scripts/build_offline.py, so Python must be present.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: apps/web/out
          retention-days: 7

  e2e:
    name: Browser journey
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: artifacts/qa/browser
          retention-days: 7

  images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Built but not pushed: publishing needs registry credentials this repository does not set.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: urjakavach-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          tags: urjakavach-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate both overlays
        run: |
          for overlay in dev prod; do
            echo "::group::$overlay"
            kubectl kustomize "k8s/overlays/$overlay" | kubectl apply --dry-run=client -f -
            echo "::endgroup::"
          done
