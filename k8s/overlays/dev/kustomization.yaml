apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: urjakavach-dev

resources:
  - namespace.yaml
  - ../../base
  # Dev only. The base deliberately has no database so production can point at a managed one.
  - postgres.yaml

# One replica each and no autoscaler: a laptop cluster has nothing to scale onto.
replicas:
  - name: urjakavach-api
    count: 1
  - name: urjakavach-web
    count: 1

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: urjakavach-api
    patch: |
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: urjakavach-api
  - target:
      kind: PodDisruptionBudget
      name: urjakavach-api
    patch: |
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: urjakavach-api
